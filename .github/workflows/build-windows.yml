name: Build Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify Windows native bindings
        run: npm run verify:win-bindings

      - name: Typecheck
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Generate Windows app icon
        run: npm run generate:icon

      - name: Fetch Windows x64 FFmpeg & FFprobe
        run: npm run fetch:ffmpeg:win

      - name: Build renderer and Electron main process
        run: npm run build:all

      - name: Verify bundled binaries
        run: node scripts/verify-win-binaries.mjs

      - name: Package NSIS Setup and Portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Helal-Video-Converter-Windows-Installer
          path: |
            release/Helal-Video-Converter-Setup.exe
            release/Helal-Video-Converter-Portable.exe
          retention-days: 14
          if-no-files-found: error
